<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Твой Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100dvh;background:#111;color:#fff;overflow:hidden}
#app{height:100%;max-width:480px;margin:auto;position:relative;transition:background .4s;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 14px) 20px calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 16px)}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.7;animation:f linear infinite}
@keyframes f{to{transform:translateY(110vh)}}
.bars{display:flex;gap:4px;width:100%;z-index:1}
.bars b{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.bars b.on{background:#fff}
h1{font-size:24px;margin-top:26px;z-index:1}
.sub{opacity:.85;margin-top:8px;font-size:15px;z-index:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1;width:100%;animation:p .5s}
@keyframes p{from{transform:scale(.8);opacity:0}}
.emo{font-size:110px;line-height:1.1}
.lbl{opacity:.85;font-size:16px;margin-top:14px}
.val{font-size:44px;font-weight:800;margin-top:6px}
.tier{margin-top:12px;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.22);font-weight:700;font-size:18px}
.btns{display:flex;gap:10px;width:100%;z-index:2;position:relative}.btns button{flex:1}
button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;position:relative;z-index:2;touch-action:manipulation}
.back{background:rgba(255,255,255,.22);color:#fff}
.next{background:#fff;color:#111}
.share{background:rgba(0,0,0,.28);color:#fff;width:100%;margin-bottom:10px}
.form{z-index:1;width:100%;overflow:auto;flex:1;margin-top:10px;text-align:left}
.form label{display:block;margin:10px 0 4px;font-size:14px;opacity:.9}
.form input,.form select{width:100%;padding:12px;border-radius:12px;border:0;font-size:16px}

.bgl{position:absolute;inset:0;animation:fade .5s both}
@keyframes fade{from{opacity:0}}
.bars b{position:relative;overflow:hidden}
.bars b.cur::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.mid{animation:none}
.mid.fwd{animation:inR .5s cubic-bezier(.2,.8,.2,1)}
.mid.bk{animation:inL .5s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(60px);opacity:0}}
@keyframes inL{from{transform:translateX(-60px);opacity:0}}
h1{animation:up .6s .05s both}.sub{animation:up .6s .15s both}
@keyframes up{from{transform:translateY(18px);opacity:0}}
.emo{animation:pop .8s .1s cubic-bezier(.3,1.6,.5,1) both,fl 3s .9s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-25deg);opacity:0}}
@keyframes fl{50%{transform:translateY(-12px) rotate(4deg)}}
.val{animation:up .6s .4s both}.lbl{animation:up .6s .3s both}
.tier{animation:pop .7s .8s cubic-bezier(.3,1.6,.5,1) both;position:relative;overflow:hidden}
.tier::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.6s 1.5s infinite}
@keyframes sh{to{left:130%}}
.li{animation:up .5s both}
.btns,.share{animation:up .6s .5s both}
button:active{transform:scale(.94);transition:transform .1s}
.snow i{animation-name:f,sw}
@keyframes sw{50%{margin-left:18px}}
.cf{position:absolute;top:-30px;z-index:3;pointer-events:none;animation:cfall linear both}
@keyframes cfall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
.pts{margin-top:14px;display:flex;flex-direction:column;align-items:center}
.pv{font-size:22px;font-weight:800;padding:7px 18px;border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(255,255,255,.14));animation:pop .7s 1.1s cubic-bezier(.3,1.6,.5,1) both,glow 2s 2s ease-in-out infinite alternate}
.pr{opacity:.7;font-size:13px;margin-top:7px;animation:up .6s 1.3s both}
@keyframes glow{to{box-shadow:0 0 20px rgba(255,255,255,.65)}}
.tot{font-size:46px;font-weight:800;margin:4px 0 12px;animation:pop .8s .3s cubic-bezier(.3,1.6,.5,1) both}
</style></head><body><div id="app"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();
 try{if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}   // свайп вниз не закрывает приложение
 try{if(tg.isVersionAtLeast&&tg.isVersionAtLeast("8.0"))tg.requestFullscreen()}catch(e){}}  // во весь экран
const BOT="https://t.me/YOUR_BOT/app";
const T=(a,b,c)=>v=>v<a?0:v<b?1:2;
const S=[
{k:"days",p:v=>Math.floor(v/10),pr:"1 балл за каждые 10 дней",t:"Твой стаж",s:"Сколько дней ты в Telegram?",u:"дней",f:T(500,1000),
 c:[["#2e9e4f","#1d6b35"],["#2f7cf6","#1747c9"],["#8a3ee0","#52209e"]],
 d:[["🐣","Новичок"],["😎","Середнячок"],["👑","Сын Дурова"]]},
{k:"pct",t:"Рейтинг в Telegram",s:"траты звёёёёёёз",u:"",f:v=>v>=50?0:v>=10?1:2,
 c:[["#e0832e","#a8501a"],["#18a8c9","#0d6f8f"],["#e0b72e","#a8741a"]],
 d:[["👥","Один из многих"],["🚀","Выше большинства"],["💎","Элита"]]},
{k:"prem",t:"Telegram Premium",s:"",u:"",f:v=>+v,
 c:[["#5b6cf0","#3a3fb5"],["#9b4be0","#e04b9b"]],
 d:[["🔒","У тебя нет Telegram Premium"],["⭐","У тебя есть Telegram Premium"]]},
{k:"gifts",p:v=>Math.floor(v/5),pr:"1 балл за каждые 5 подарков",t:"Обычные подарки",s:"Сколько их в твоём профиле?",u:"шт.",f:v=>v<=3?0:v<=10?1:2,
 c:[["#6a7a8c","#3c4a5a"],["#e0832e","#b8461a"],["#e0457b","#a3194f"]],
 d:[["🎁","Скромная полка"],["🎀","Неплохая коллекция"],["🏆","Подарочный магнат"]]},
{k:"nft",p:v=>v,pr:"1 балл за каждый NFT-подарок",t:"NFT-подарки",s:"Улучшенные подарки в профиле",u:"шт.",f:v=>v<=3?0:v<=10?1:2,
 c:[["#00c2d1","#0a5fb0"],["#7b5cff","#d13fc1"],["#f7b733","#fc4a1a"]],
 d:[["🧸","Начинающий коллекционер"],["💠","Серьёзный коллекционер"],["🐉","Легенда рынка"]]},
{k:"fast",t:"Самый быстрый ответ",s:"Ты что 24/7 в телеграмме?",f:()=>0,c:[["#2e9e4f","#1d6b35"]],d:[["⚡",""]]},
{k:"slow",t:"Самый долгий ответ",s:"Как же долго он ждал ответа....",f:()=>0,c:[["#2f7cf6","#1747c9"]],d:[["🐌",""]]},
{k:"online",t:"Постоянный онлайн",s:"В этот день ты сидел больше всего в телеграмме!",f:()=>0,c:[["#8a3ee0","#52209e"]],d:[["😈",""]]}
];
const pts=s=>s.p?s.p(D[s.k]):0, total=()=>S.reduce((a,s)=>a+pts(s),0);
const pl=n=>n%10==1&&n%100!=11?"балл":(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?"балла":"баллов";
const RND=["fast","slow","online"];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rolls(){ // случайные значения, но у одного человека всегда одни и те же (зависят от его ID)
 const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,id=D.id||(u&&u.id)||1,r=rng(id*7919+13);
 D.fast="&lt; "+(0.1+Math.floor(r()*7)/10).toFixed(1)+" секунд";
 D.slow=(10+Math.floor(r()*61))+" ч.";
 const m=[["июня",30],["июля",31],["августа",31]][Math.floor(r()*3)];
 D.online=(1+Math.floor(r()*m[1]))+" "+m[0]+", 2026"}
const API=""; // бэкенд на том же адресе
const DEMO={stars:3450,days:640,pct:12,lvl:7,prem:1,gifts:5,nft:2,value:1200,id:0};
const D={};let i=0;const app=document.getElementById("app");
async function load(){
 app.innerHTML=snow()+'<div class="mid"><div class="emo">⏳</div><div class="lbl">Считаем твою статистику…</div></div>';bg(["#5b6cf0","#3a3fb5"]);
 try{const r=await fetch(API+"/api/me",{headers:{Authorization:"tma "+(tg?tg.initData:"")}});if(!r.ok)throw 0;Object.assign(D,await r.json())}
 catch(e){Object.assign(D,DEMO)}
 rolls();  // без бэкенда показываем демо-данные
 i=0;show()}
function fx(n,all){
 document.querySelectorAll(".cnt").forEach(el=>{const to=+el.dataset.to,t0=performance.now(),D=1300;
  (function f(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString("ru");if(p<1)requestAnimationFrame(f)})(t0)});
 if(n==2){const E=["🎉","✨","⭐","🎊","💫"];for(let k=0;k<26;k++){const c=document.createElement("span");c.className="cf";c.textContent=E[k%5];
  c.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*2}s;font-size:${16+Math.random()*18}px`;app.appendChild(c);setTimeout(()=>c.remove(),5000)}}
 if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(n==2?"heavy":"light")}
function snow(){let h="";for(let n=0;n<28;n++)h+=`<i style="left:${Math.random()*100}%;animation-duration:${4+Math.random()*6}s;animation-delay:-${Math.random()*8}s"></i>`;return`<div class="bgl" style="background:${nb}"></div><div class="snow">${h}</div>`}
let cur="#5b6cf0",nb=cur,dir="fwd";
function bg(c){try{if(tg){tg.setHeaderColor(c[0]);tg.setBackgroundColor(c[1])}}catch(e){}
 app.style.background=cur;nb=`linear-gradient(160deg,${c[0]},${c[1]})`;setTimeout(()=>{cur=nb;app.style.background=cur},500)}
const N=x=>`<span class="cnt" data-to="${x}">0</span>`;
function val(s){const v=D[s.k];if(RND.includes(s.k))return`<span style="font-size:38px">${v}</span>`;if(s.k=="prem")return"";if(s.k=="pct")return`Рейтинг ${N(D.lvl)}<br><span style="font-size:22px;font-weight:600">Ты в топ ${N(v)}% пользователей</span><br><span style="font-size:22px;font-weight:700;display:inline-block;margin-top:8px">⭐ Потрачено звёзд: ${N(D.stars||0)}</span>`;return N(v)+(s.u?`<br><span style="font-size:20px;font-weight:600">${s.u}</span>`:"")}
function show(){
 if(i>=S.length){final();return}
 const s=S[i],n=s.f(D[s.k]),[e,name]=s.d[n];bg(s.c[n]);
 app.innerHTML=snow()+`<div class="bars">${S.map((_,j)=>`<b class="${j<i?"on":j==i?"cur":""}"></b>`).join("")}</div>
 <h1>${s.t}</h1><div class="sub">${s.s}</div>
 <div class="mid ${dir}"><div class="emo">${e}</div><div class="val">${val(s)}</div>${name?`<div class="tier">${name}</div>`:""}${s.p?`<div class="pts"><div class="pv">+${N(pts(s))} ${pl(pts(s))}</div><div class="pr">${s.pr}</div></div>`:""}</div>
 <button type="button" class="share" data-a="s">Поделиться ↗</button><div class="btns"><button type="button" class="back" data-a="b">Назад</button><button type="button" class="next" data-a="n">Продолжить</button></div>`;fx(n)}
function final(){bg(["#2f7cf6","#8a3ee0"]);
 const r=S.map(s=>s.d[s.f(D[s.k])]);
 app.innerHTML=snow()+`<h1>Итоги</h1><div class="sub">Вот кто ты в Telegram</div><div class="mid" style="font-size:18px;gap:8px"><div class="lbl" style="margin:0">Сумма баллов</div><div class="tot">🏆 ${N(total())} ${pl(total())}</div>`+
 S.map((s,j)=>`<div class="li" style="animation-delay:${j*.12+.2}s">${r[j][0]} <b>${s.t}:</b> ${r[j][1]||D[s.k]}${s.p?` · <b>+${pts(s)}</b>`:""}</div>`).join("")+
 `</div><button type="button" class="share" data-a="s">Поделиться ↗</button><div class="btns"><button type="button" class="back" data-a="b">Назад</button></div>`;fx(2,1)}
dir="fwd";
function go(d){dir=d>0?"fwd":"bk";i=Math.min(S.length,Math.max(0,i+d));show();if(tg)i>0?tg.BackButton.show():tg.BackButton.hide()}
async function share(){
 const s=S[Math.min(i,S.length-1)],n=s.f(D[s.k]);
 try{const r=await fetch(API+"/api/share",{method:"POST",headers:{Authorization:"tma "+tg.initData,"Content-Type":"application/json"},body:JSON.stringify({slide:s.k,tier:n,title:s.t+": "+(s.d[n][1]||D[s.k].replace("&lt;","<"))})});
  const {id}=await r.json();tg.shareMessage(id)}
 catch(e){const l="https://t.me/share/url?url="+encodeURIComponent(BOT)+"&text="+encodeURIComponent(s.d[n][0]+" "+s.t+": "+(s.d[n][1]||s.s)+"\nПроверь какая у тебя карточка!");tg?tg.openTelegramLink(l):window.open(l)}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;a=="n"?go(1):a=="b"?go(-1):share()});
if(tg)tg.BackButton.onClick(()=>go(-1));
load();
</script></body></html>
