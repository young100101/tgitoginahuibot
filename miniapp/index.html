 app.innerHTML=snow()+`<h1>Итоги</h1><div class="sub">Вот кто ты в Telegram</div><div class="mid" style="font-size:15px;gap:5px;overflow-y:auto;justify-content:flex-start;padding-top:18px"><div class="lbl" style="margin:0">Сумма баллов</div><div class="tot">${rich("🏆")} ${N(total())} ${pl(total())}</div>`+
 S.map((s,j)=>`<div class="li" style="animation-delay:${j*.12+.2}s">${s.k=="nft"?rich(NFTE):rich(r[j][0])} <b>${s.t}:</b> ${r[j][1]||D[s.k]}${s.p?` · <b>+${pts(s)}</b>`:""}</div>`).join("")+
 `</div><button type="button" class="share" data-a="s">Поделиться ↗</button><div class="btns"><button type="button" class="back" data-a="b">Назад</button><button type="button" class="next" data-a="m">Продолжить</button></div>`;fx(2,1,"final")}
dir="fwd";
function go(d){dir=d>0?"fwd":"bk";i=Math.min(S.length,Math.max(0,i+d));show();if(tg)i>0?tg.BackButton.show():tg.BackButton.hide()}
const BOTSTART=BOT.replace(/\/[^\/]*$/,"")+"?start=share";   // ссылка на /start бота
function caption(s,n){ // текст под карточкой — про тот слайд, где нажали «Поделиться»
 const nm=s.d[n][1],v=D[s.k],em=plain(s.d[n][0]),h=x=>String(x).replace("&lt;","<"),end="\n\nУзнай свои результаты 👇";
 switch(s.k){
  case"days":return`${em} Я в Telegram уже ${v} дн. — ${nm}! Аккаунт ${regYear(v)} года, таких ${YP[regYear(v)]}. А ты как давно?`+end;
  case"pct":return`${em} Мой рейтинг в Telegram — ${D.lvl}, я в топ ${v}% пользователей!\n⭐ Потрачено звёзд: ${D.stars||0}`+end;
  case"prem":return`${em} ${nm.replace("У тебя","У меня")}! А у тебя?`+end;
  case"gifts":return`${em} Обычных подарков в моём профиле: ${v} — ${nm}!`+end;
  case"nft":return`${em} NFT-подарков в моём профиле: ${v} — ${nm}!`+end;
  case"fast":return`⚡ Мой самый быстрый ответ — ${h(v)}! Ты что 24/7 в телеграмме?`+end;
  case"slow":return`🐌 Самый долгий ответ — ${v}... Как же долго он ждал ответа 😅`+end;
  case"online":return`😈 В этот день я сидел больше всего в телеграмме: ${v}!`+end;
  case"dialog":return`💬 Мой самый длинный диалог в Telegram — ${v}!`+end;
  case"pinned":return`📌 Мой чат закрепляли ${v}!`+end;
  case"nobreak":return`🧊 Самый долгий период без общения — ${v}...`+end;
  case"maxmsgs":return`🔥 Максимум сообщений за один день — ${v}!`+end}
 return`${em} ${s.t}: ${nm}`+end}
async function share(){
 const fin=i>=S.length,s=fin?null:S[i],n=fin?0:s.f(D[s.k]);
 const text=fin?`🏆 Мои итоги в Telegram — ${total()} ${pl(total())}!\nУзнай свои результаты 👇`:caption(s,n);
 try{if(!tg||!tg.shareMessage||!tg.isVersionAtLeast("8.0"))throw 0;
  const r=await fetch(API+"/api/share",{method:"POST",headers:{Authorization:"tma "+tg.initData,"Content-Type":"application/json"},body:JSON.stringify({slide:fin?"final":s.k,tier:n,text})});
  if(!r.ok)throw 0;const {id}=await r.json();tg.shareMessage(id)}
 catch(e){const l="https://t.me/share/url?url="+encodeURIComponent(BOTSTART)+"&text="+encodeURIComponent(text);tg?tg.openTelegramLink(l):window.open(l)}}

// ===== Плашка «Хочешь узнать больше?» =====
const OV=document.createElement("div");OV.id="ov";OV.className="ov";OV.innerHTML='<div class="sh" id="sh"></div>';document.body.appendChild(OV);
if(tg&&tg.colorScheme=="dark")OV.dataset.th="dark";
const SH=document.getElementById("sh"),live=!!(tg&&tg.initData);
let VIEW="menu",MORE=null,TOP=null,FAIL=false,COPIED=false,NOTE="";
const parent=()=>VIEW=="inv"&&MORE&&MORE.price>0&&!MORE.unlocked?"opt":"menu";
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru");
const fr=n=>n==1?"друга":"друзей";
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({Authorization:"tma "+(tg?tg.initData:"")},opt.headers||{});const r=await fetch(API+path,opt);if(!r.ok)throw r.status;return r.json()}
// демо-данные только для просмотра вне Telegram
const DM={need:3,count:1,price:75,paid:false,unlocked:false,link:BOTSTART.replace("start=share","start=ref_0"),rank:200,points:0};
const demoTop=()=>{const n=["Алексей","Мария","Дмитрий","Анна","Иван","Ольга","Сергей","Елена","Никита","Юля"];return{top:Array.from({length:100},(_,k)=>({rank:k+1,name:n[k%10]+" "+String.fromCharCode(1040+k%26)+".",username:k%3?"user"+(k+1):"",photo:"",points:Math.max(5,Math.round(900/(1+k*.35)))})),me:{rank:200,points:total()}}};
const avatar=p=>{const nm=(p.name||"?").trim(),ini=esc([...nm][0]||"?").toUpperCase(),h=[...nm].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
 return p.photo?`<img class="av" src="${esc(p.photo)}" data-ini="${ini}" data-h="${h}" alt="">`:`<div class="av ini" style="background:hsl(${h} 62% 52%)">${ini}</div>`};
document.addEventListener("error",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("av")){const d=document.createElement("div");d.className="av ini";d.style.background=`hsl(${t.dataset.h} 62% 52%)`;d.textContent=t.dataset.ini;t.replaceWith(d)}},true);
const prog=m=>`<div class="pc"><div class="pr2"><span>Приглашено</span><b>${m.count} из ${m.need}</b></div><div class="pb"><i style="width:${m.need?Math.min(100,m.count/m.need*100):100}%"></i></div></div>`;
const ITEMS=[{k:"top",ic:"🏆",c:["#ffb347","#ff6b6b"],t:"Таблица лидеров",s:"Топ-100 по баллам за аккаунт"},
 {k:"gv",ic:"{g}",c:["#ff6b9d","#c44dff"],t:"Сколько ты подарил подарков",s:""},
 {k:"bl",ic:"🚫",c:["#ff9966","#e0384f"],t:"Сколько людей тебя заблокировало",s:""},
 {k:"hr",ic:"⏱️",c:["#4facfe","#00c6a7"],t:"Сколько часов ты провёл в Telegram",s:""}];
// экраны с «оценкой»: считаем по формулам из данных аккаунта
const pl3=(n,w)=>n%10==1&&n%100!=11?w[0]:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?w[1]:w[2];
const DET={
 gv:{ic:"{g}",c:["#ff6b9d","#c44dff"],t:"Ты подарил подарков",v:()=>Math.floor((D.stars||0)/40),w:["подарок","подарка","подарков"]},
 bl:{ic:"🚫",c:["#ff9966","#e0384f"],t:"Тебя заблокировали",v:()=>Math.round((D.days||0)*0.3),w:["человек","человека","человек"]},
 hr:{ic:"⏱️",c:["#4facfe","#00c6a7"],t:"Ты провёл в Telegram",v:()=>Math.round((D.days||0)*70/60),w:["час","часа","часов"],extra:v=>{const d=Math.round(v/24);return`это около ${N(d)} суток без перерыва`}}};
function vDet(k){const x=DET[k],v=x.v();
 return `<div class="dt" style="--c1:${x.c[0]};--c2:${x.c[1]}"><div class="big">${rich(x.ic)}</div><h2>${x.t}</h2><div class="num">≈ ${N(v)}</div><div class="unit">${pl3(v,x.w)}</div>${x.extra?`<p class="mut">${x.extra(v)}</p>`:""}</div><div class="bt col"><button type="button" class="b2" data-s="menu">Назад</button></div>`}
function cu(){document.querySelectorAll("#sh .cnt").forEach(el=>{const to=+el.dataset.to,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString("ru");if(p<1)requestAnimationFrame(f)})(t0)})}
const loading=()=>`<div class="ld"><div class="spin"></div><p class="mut">Загружаем…</p></div>`;
function vMenu(){const m=MORE,lock=!m.unlocked,left=Math.max(0,m.need-m.count);
 return `<h2>Хочешь узнать больше?</h2><p class="mut">${lock?`Пригласи ${m.need} ${fr(m.need)} — и всё откроется бесплатно`:"Всё открыто — выбирай!"}</p>
 <div class="rows">${ITEMS.map((x,j)=>`<button type="button" class="row" style="animation-delay:${j*.08}s" data-s="${lock?"more":x.k}"><span class="ic" style="background:linear-gradient(135deg,${x.c[0]},${x.c[1]})">${rich(x.ic)}${lock?'<i class="lk">🔒</i>':""}</span><span class="rt"><b>${x.t}</b>${x.s?`<small>${x.s}</small>`:""}</span><span class="chev">›</span></button>`).join("")}</div>
 <div class="bt">${lock?`<button type="button" class="b2" data-s="x">Нет, спасибо</button><button type="button" class="b1" data-s="more">Узнать больше информации<span class="pill">ещё ${left}</span></button>`:`<button type="button" class="b2" data-s="x">Назад</button>`}</div>`}
function vInv(){const m=MORE,left=Math.max(0,m.need-m.count);
 return `<div class="big">💌</div><h2>${left?`Пригласи ещё ${left} ${fr(left)}`:"Ты пригласил всех!"}</h2>
 <p class="mut">${left?"Друг должен перейти по твоей ссылке, нажать «Начать» и выполнить задания бота (если они есть).":"Дополнительная информация открыта."}</p>${prog(m)}
 <div class="bt col">${left?`<button type="button" class="b1" data-s="send">📤 Переслать приглашение</button><button type="button" class="b2" data-s="copy">${COPIED?"✅ Ссылка скопирована":"🔗 Скопировать ссылку"}</button>`:""}<button type="button" class="b2" data-s="back">Назад</button></div>`}
function vOpt(){const m=MORE,left=Math.max(0,m.need-m.count);
 return `<div class="big">🔓</div><h2>Как открыть?</h2><p class="mut">Выбери удобный способ</p>${prog(m)}
 <div class="rows"><button type="button" class="row" data-s="inv"><span class="ic" style="background:linear-gradient(135deg,#34c759,#1f9d6a)">👥</span><span class="rt"><b>Пригласить друзей</b><small>Бесплатно · ещё ${left} из ${m.need}</small></span><span class="chev">›</span></button>
 <button type="button" class="row" style="animation-delay:.08s" data-s="pay"><span class="ic" style="background:linear-gradient(135deg,#ffb347,#ff7a18)">${rich("⭐")}</span><span class="rt"><b>Оплатить ${fmt(m.price)} ${rich("⭐")}</b><small>Откроется сразу, без приглашений</small></span><span class="chev">›</span></button></div>
 ${NOTE?`<p class="note">${NOTE}</p>`:""}<div class="bt col"><button type="button" class="b2" data-s="menu">Назад</button></div>`}
const medal=r=>r==1?"🥇":r==2?"🥈":r==3?"🥉":r;
function vTop(){if(!TOP)return loading()+`<div class="bt col"><button type="button" class="b2" data-s="menu">Назад</button></div>`;
 const me=TOP.me,last=TOP.top[TOP.top.length-1],out=me.rank&&me.rank>TOP.top.length;
 return `<h2>🏆 Таблица лидеров</h2><p class="mut">Топ-100 по баллам за аккаунт</p>
 <div class="lst">${TOP.top.map(p=>`<div class="lr${me.rank==p.rank?" me":""}"><span class="rk${p.rank<=3?" md":""}">${medal(p.rank)}</span>${avatar(p)}<span class="rt"><b>${esc(p.name)}</b></span><span class="pt">${fmt(p.points)}</span></div>`).join("")}</div>
 <div class="mecard"><div><small>Твоё место</small><b>${me.rank?me.rank+"-е место":"пока нет в рейтинге"}</b>${me.rank?"":"<small>Нажми «Начать» в боте, чтобы попасть в рейтинг</small>"}${out&&last?`<small>До топ-100 ещё ${fmt(Math.max(1,last.points-me.points+1))} ${pl(Math.max(1,last.points-me.points+1))}</small>`:""}</div><span class="pt">${fmt(me.points)}</span></div>
 <div class="bt col"><button type="button" class="b2" data-s="menu">Назад</button></div>`}
function renderSheet(){
 let h=loading();
 if(FAIL)h=`<div class="ld"><div class="big">😕</div><p class="mut">Не получилось загрузить. Попробуй позже.</p></div><div class="bt col"><button type="button" class="b2" data-s="x">Закрыть</button></div>`;
 else if(MORE)h=VIEW=="inv"?vInv():VIEW=="top"?vTop():VIEW=="opt"?vOpt():VIEW.startsWith("d:")?vDet(VIEW.slice(2)):vMenu();
 SH.innerHTML='<div class="grab"></div>'+h;hydrate();cu()}
async function refreshMore(){const prev=JSON.stringify(MORE);try{MORE=live?await api("/api/more"):Object.assign({},DM,{points:total(),count:MORE?MORE.count:DM.count});FAIL=false}catch(e){FAIL=!MORE}
 if(OV.classList.contains("on")&&(FAIL||JSON.stringify(MORE)!==prev))renderSheet()}   // перерисовываем, только если данные изменились — без мигания
function openSheet(){VIEW="menu";renderSheet();void OV.offsetWidth;document.body.classList.add("sheet");try{window.lottie&&lottie.pause()}catch(e){}
 requestAnimationFrame(()=>{OV.classList.add("on");if(tg)tg.BackButton.show();setTimeout(refreshMore,450)})}
function closeSheet(){OV.classList.remove("on");document.body.classList.remove("sheet");try{window.lottie&&lottie.play()}catch(e){}if(tg&&i==0)tg.BackButton.hide()}
function sheetBack(){if(VIEW!="menu"){VIEW=parent();renderSheet()}else closeSheet()}
async function openTop(){VIEW="top";TOP=null;renderSheet();
 try{TOP=live?await api("/api/top"):demoTop();renderSheet()}
 catch(e){if(e==403){await refreshMore();VIEW=MORE&&MORE.price>0?"opt":"inv"}else FAIL=true;renderSheet()}}
async function pay(){NOTE="";
 if(!live){NOTE="Оплата работает только внутри Telegram";renderSheet();return}
 try{const {url}=await api("/api/pay",{method:"POST"});
  if(tg.openInvoice)tg.openInvoice(url,st=>{if(st=="paid")waitPaid();else if(st=="failed"){NOTE="Оплата не прошла, попробуй ещё раз";renderSheet()}});
  else tg.openTelegramLink(url)}
 catch(e){NOTE="Не удалось создать счёт. Попробуй позже";renderSheet()}}
async function waitPaid(){NOTE="Проверяем оплату…";renderSheet();
 for(let k=0;k<10;k++){await refreshMore();if(MORE&&MORE.unlocked)break;await new Promise(r=>setTimeout(r,1200))}
 NOTE="";VIEW="menu";renderSheet();if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred("success")}
async function sendInvite(){
 try{if(!live||!tg.shareMessage||!tg.isVersionAtLeast("8.0"))throw 0;const {id}=await api("/api/invite",{method:"POST"});tg.shareMessage(id)}
 catch(e){const l="https://t.me/share/url?url="+encodeURIComponent(MORE.link)+"&text="+encodeURIComponent("👋 Смотри результаты своего Telegram-аккаунта!");tg?tg.openTelegramLink(l):window.open(l)}}
async function copyLink(){const t=MORE.link;
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(x){}a.remove()}
 COPIED=true;renderSheet();if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred("success");setTimeout(()=>{COPIED=false;if(VIEW=="inv"&&OV.classList.contains("on"))renderSheet()},2200)}
OV.addEventListener("click",e=>{
 if(e.target===OV){closeSheet();return}
 const b=e.target.closest("[data-s]");if(!b)return;const a=b.dataset.s;
 if(a=="x")closeSheet();else if(a=="menu"){VIEW="menu";renderSheet()}
 else if(a=="more"){VIEW=MORE.price>0?"opt":"inv";NOTE="";renderSheet()}else if(a=="inv"){VIEW="inv";renderSheet()}else if(a=="back"){VIEW=parent();renderSheet()}else if(a=="pay")pay();else if(a=="menu0"){}else if(a=="top")openTop();else if(DET[a]){VIEW="d:"+a;renderSheet()}
 else if(a=="send")sendInvite();else if(a=="copy")copyLink()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&OV.classList.contains("on")&&live)refreshMore()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;a=="n"?go(1):a=="b"?go(-1):a=="m"?openSheet():share()});
if(tg)tg.BackButton.onClick(()=>{if(OV.classList.contains("on"))sheetBack();else go(-1)});
fetchMe().then(()=>refreshMore());   // данные и «доп. инфо» грузим заранее, пока человек держит палец
intro();
</script></body></html>
