<style>
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100dvh;background:#111;color:#fff;overflow:hidden}
#app{height:100%;max-width:480px;margin:auto;position:relative;transition:background .4s;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 14px) 20px calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 16px)}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.7;animation:f linear infinite}
@keyframes f{to{transform:translateY(110vh)}}
.bars{display:flex;gap:4px;width:100%;z-index:1}
.bars b{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}

h1{font-size:24px;margin-top:26px;z-index:1}
.sub{opacity:.85;margin-top:8px;font-size:15px;z-index:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1;width:100%;animation:p .5s}
@keyframes p{from{transform:scale(.8);opacity:0}}
.emo{font-size:110px;line-height:1.1}

.tier{margin-top:12px;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.22);font-weight:700;font-size:18px}

button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;position:relative;z-index:2;touch-action:manipulation}
.back{background:rgba(255,255,255,.22);color:#fff}
.next{background:#fff;color:#111}
.share{background:rgba(0,0,0,.28);color:#fff;width:100%;margin-bottom:10px}
.form{z-index:1;width:100%;overflow:auto;flex:1;margin-top:10px;text-align:left}
.form label{display:block;margin:10px 0 4px;font-size:14px;opacity:.9}
.form input,.form select{width:100%;padding:12px;border-radius:12px;border:0;font-size:16px}

.bgl{position:absolute;inset:0;animation:fade .5s both}
@keyframes fade{from{opacity:0}}
.bars b{position:relative;overflow:hidden}
.bars b.cur::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.mid{animation:none}
.mid.fwd{animation:inR .5s cubic-bezier(.2,.8,.2,1)}
.mid.bk{animation:inL .5s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(60px);opacity:0}}
@keyframes inL{from{transform:translateX(-60px);opacity:0}}
h1{animation:up .6s .05s both}.sub{animation:up .6s .15s both}
@keyframes up{from{transform:translateY(18px);opacity:0}}
.emo{animation:pop .8s .1s cubic-bezier(.3,1.6,.5,1) both,fl 3s .9s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-25deg);opacity:0}}
@keyframes fl{50%{transform:translateY(-12px) rotate(4deg)}}
.val{animation:up .6s .4s both}.lbl{animation:up .6s .3s both}
.tier{animation:pop .7s .8s cubic-bezier(.3,1.6,.5,1) both;position:relative;overflow:hidden}
.tier::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.6s 1.5s infinite}
@keyframes sh{to{left:130%}}
.li{animation:up .5s both}
.btns,.share{animation:up .6s .5s both}
button:active{transform:scale(.94);transition:transform .1s}
.snow i{animation-name:f,sw}
@keyframes sw{50%{margin-left:18px}}
.cf{position:absolute;top:-30px;z-index:3;pointer-events:none;animation:cfall linear both}
@keyframes cfall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
.pts{margin-top:14px;display:flex;flex-direction:column;align-items:center}
.pv{font-size:22px;font-weight:800;padding:7px 18px;border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.38),rgba(255,255,255,.14));animation:pop .7s 1.1s cubic-bezier(.3,1.6,.5,1) both,glow 2s 2s ease-in-out infinite alternate}
.pr{opacity:.7;font-size:13px;margin-top:7px;animation:up .6s 1.3s both}
@keyframes glow{to{box-shadow:0 0 20px rgba(255,255,255,.65)}}
.tot{font-size:46px;font-weight:800;margin:4px 0 12px;animation:pop .8s .3s cubic-bezier(.3,1.6,.5,1) both}
.ce{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.15em;line-height:1}
.ce svg,.ce img,.ce video{width:100%;height:100%;display:block}
.fp{position:absolute;top:-60px;z-index:1;pointer-events:none;animation:fallp linear both;will-change:transform}
.fp img{width:100%;height:100%;display:block}
@keyframes fallp{to{transform:translateY(112vh) rotate(300deg)}}
</style></head><body><div id="app"></div>
<script>

  if(ct.includes("json"))return window.lottie?{k:"l",d:await r.json()}:thumb(id);
  if(ct.includes("video")){const v=document.createElement("video");if(IOS||!v.canPlayType('video/webm; codecs="vp9"'))return thumb(id);return{k:"v",u:URL.createObjectURL(await r.blob())}}
  return{k:"i",u:URL.createObjectURL(await r.blob())}}).catch(()=>thumb(id).catch(()=>null)))}
function put(el,e){ // вставить эмодзи в элемент

 if(e.k=="l"&&window.lottie)lottie.loadAnimation({container:el,renderer:"svg",loop:true,autoplay:true,animationData:JSON.parse(JSON.stringify(e.d))});

const ST={};
function stillOld(id){ // неподвижная картинка эмодзи (один кадр) — чтобы падающие не нагружали экран
 return loadEmoji(id).then(e=>new Promise(res=>{
  if(!e)return res(null);

  if(e.k!="l"||!window.lottie)return res(null);
  try{const cv=document.createElement("canvas");cv.width=cv.height=128;const cx=cv.getContext("2d");
   const an=lottie.loadAnimation({renderer:"canvas",loop:false,autoplay:false,animationData:JSON.parse(JSON.stringify(e.d)),rendererSettings:{context:cx,clearCanvas:true}});
   an.addEventListener("DOMLoaded",()=>{

 if(n==2&&key!="days"&&key!="gifts"&&key!="nft"){const E=["🎉","✨","⭐","🎊","💫"];for(let k=0;k<26;k++){const c=document.createElement("span");c.className="cf";if(E[k%5]=="⭐")c.innerHTML=CE(EM.star,"⭐");else c.textContent=E[k%5];

 const nm=s.d[n][1],v=D[s.k],em=plain(s.d[n][0]),h=x=>String(x).replace("&lt;","<"),end="\n\nУзнай свои результаты 👇";
